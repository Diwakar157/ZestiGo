server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  application:
    name: zestigo-backend

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}
            scope:
              - email
              - profile
      resourceserver:
        jwt:
          issuer-uri: ${CLERK_ISSUER_URL:}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zestigo_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT Configuration Properties
jwt:
  # Base64-encoded secret key (256-bit minimum for HS256)
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds

clerk:
  publishable-key: ${CLERK_PUBLISHABLE_KEY:change-me}
  secret-key: ${CLERK_SECRET_KEY:change-me}
  issuer-url: ${CLERK_ISSUER_URL:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:change-me}
  key-secret: ${RAZORPAY_KEY_SECRET:change-me}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:change-me}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO

# Application URL configurations for CORS and OAuth2 redirects
app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  admin-url: ${ADMIN_URL:http://localhost:3001}

